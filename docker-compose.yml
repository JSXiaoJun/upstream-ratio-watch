services:
  upstream-ratio-watch:
    image: ghcr.io/jsxiaojun/upstream-ratio-watch:latest
    pull_policy: always
    container_name: upstream-ratio-watch
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      TZ: Asia/Shanghai
      APP_TIMEZONE: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - qq-notify

networks:
  qq-notify:
    external: true
    name: qq-notify
